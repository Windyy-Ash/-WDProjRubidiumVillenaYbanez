<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="https://yoolk.ninja/wp-content/uploads/2021/08/Games-GenshinImpact-1024x1024.png" />
  <title>Looping Background Music</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #muteBtn {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      cursor: pointer;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="muteBtn">🔊 Sound On</button>

<script>
  const audio = document.getElementById("bgm");
  const btn = document.getElementById("muteBtn");
  let started = false;

  function startAudio() {
    if (started) return;

    audio.play().then(() => {
      started = true;
      btn.style.display = "block";
      audio.loop = true;
    }).catch(() => {});
  }

  window.addEventListener("click", startAudio, { once: true });
  window.addEventListener("keydown", startAudio, { once: true });
  window.addEventListener("scroll", startAudio, { once: true });

  btn.addEventListener("click", () => {
    audio.muted = !audio.muted;
    btn.textContent = audio.muted ? "🔇 Muted" : "🔊 Sound On";
  });
</script>
</body>
</html>
