<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Choose Traveler</title>
  <link rel="icon" type="image/x-icon" href="https://yoolk.ninja/wp-content/uploads/2021/08/Games-GenshinImpact-1024x1024.png" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-default: url('https://i.namu.wiki/i/do9PpyiYHniftUX9e8NVjj3IgysRe9Bnqv4F41fK35qyBdJxUJfC8ntQTcs9YCVfG2qH2pMctqwJWBR1NJY56g.gif');
        --bg-aether: url('https://upload-os-bbs.hoyolab.com/upload/2021/08/12/64359086/6cd7666916474489ccdea83fb788f505_6283831987195124468.gif');
        --bg-lumine: url('https://gifdb.com/images/high/genshin-impact-traveler-lumine-333dwasply0wnq8n.gif');
    }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg-default) no-repeat center center/cover;
        overflow: hidden;
        transition: background-image 0.35s ease;
    }

    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        backdrop-filter: blur(1px);
    }

    .container {
        position: relative;
        display: flex;
        justify-content: space-between;
        width: 80%;
        padding-top: 250px;
    }

    .option-box {
        width: 40%;
        padding: 40px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        backdrop-filter: blur(6px);
        text-align: center;
        font-size: 2rem;
        color: #111;
        font-family: 'Playfair Display', 'Times New Roman', serif;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        cursor: pointer;
        transition: 0.35s ease;
        border: 2px solid rgba(255,255,255,0.4);
        box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .option-box:hover {
        transform: translateY(-12px) scale(1.03);
        box-shadow: 0 0 25px gold, 0 0 45px gold inset;
        border-color: gold;
    }

    body:has(.option-box.aether:hover) {
        background-image: var(--bg-aether);
    }

    body:has(.option-box.lumine:hover) {
        background-image: var(--bg-lumine);
    }

    @media (max-width: 768px) {
        body {
            align-items: flex-start;
        }

        .container {
            flex-direction: column;
            align-items: center;
            width: 90%;
            padding-top: 140px;
            gap: 30px;
        }

        .option-box {
            width: 100%;
            max-width: 320px;
            font-size: 1.6rem;
            padding: 30px;
        }
    }

    body {
      margin: 0;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }
     @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #muteBtn {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 10px 14px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      cursor: pointer;
      z-index: 999;
      display: none;
    }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="decor"></div>
<div class="decor"></div>

<div class="container">
    <div class="option-box lumine" onclick="location.href='loadingscreenLu.html'">Lumine</div>
    <div class="option-box aether" onclick="location.href='loadingscreenAe.html'">Aether</div>
</div>

<audio id="bgm" loop>
  <source src="newmusic.mp3" type="audio/mpeg">
</audio>

<button id="muteBtn">🔊 Sound On</button>
<script>
    const audio = document.getElementById("bgm");
    const btn = document.getElementById("muteBtn");
    let started = false;

    function startAudio() {
        if (started) return;

        audio.play().then(() => {
        started = true;
        btn.style.display = "block";
        audio.loop = true;
        }).catch(() => {});
    }

    window.addEventListener("click", startAudio, { once: true });
    window.addEventListener("keydown", startAudio, { once: true });
    window.addEventListener("scroll", startAudio, { once: true });

    btn.addEventListener("click", () => {
        audio.muted = !audio.muted;
        btn.textContent = audio.muted ? "🔇 Muted" : "🔊 Sound On";
    });
</script>
</body>
</html>
