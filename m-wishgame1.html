<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="https://yoolk.ninja/wp-content/uploads/2021/08/Games-GenshinImpact-1024x1024.png" />
    <title>Teyvat Gacha Shop</title>
    <style>
        :root {
            --rarity5: #f3ad18;
            --rarity4: #a256e1;
            --rarity3: #5180cc;
        }

        body {
            margin: 0; 
            padding: 0;
            background: #111 url('https://www.dualshockers.com/static/uploads/2021/04/Genshin-Impact-Inazuma-concept-artwork-Tatarasuna-Kannazuka-resized-1024x512.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            color: white; 
            display: flex; 
            overflow: hidden;
        }

        #status-bar {
            width: 320px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            border-right: 2px solid rgba(255, 215, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            text-align: center;
        }

        .stat-val { 
            font-size: 22px; 
            font-weight: bold; 
            color: #ffd700; 
        }

        .convert-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 100%; 
            padding: 8px; 
            border-radius: 5px;
            border: none;
            margin-bottom: 10px; 
            text-align: center; 
            font-weight: bold;
        }

        #inventory-list {
            flex-grow: 1; 
            overflow-y: auto;
            margin-top: 10px; 
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        .inv-item {
            display: flex; 
            align-items: center; 
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 5px; 
            padding: 8px; 
            border-radius: 5px; 
            font-size: 13px;
        }

        .inv-item img { 
            width: 35px; 
            height: 35px; 
            border-radius: 4px; 
        }

        .rarity-5 { 
            border-left: 4px solid var(--rarity5); 
        }

        .rarity-4 { 
            border-left: 4px solid var(--rarity4); 
        }

        .rarity-3 { 
            border-left: 4px solid var(--rarity3); 
        }

        #banner-wrap {
            flex-grow: 1; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
        }

        .action-buttons { 
            margin-top: 50px; 
            display: flex; 
            gap: 20px; 
        }

        .wish-btn {
            background: #ece5d8; 
            color: #333; 
            border: none;
            padding: 12px 25px;
            border-radius: 50px; 
            font-weight: bold;
            cursor: pointer; 
            transition: 0.2s;
        }

        .wish-btn:hover { 
            background: #fff; 
            transform: scale(1.05); 
        }

        #wish-overlay, #results-screen {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            display: none; 
            z-index: 100;
        }

        #wish-overlay { 
            background: black; 
            justify-content: center; 
            align-items: center; 
        }

        #loading-gif { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        #results-screen {
            background: rgba(0,0,0,0.9); 
            grid-template-columns: repeat(5, 1fr);
            gap: 15px; 
            padding: 80px; 
            box-sizing: border-box; 
            z-index: 101; 
            overflow-y: auto;
        }

        .result-card {
            background: rgba(255,255,255,0.1); 
            border-radius: 10px; 
            padding: 10px;
            text-align: center; 
            border-bottom: 5px solid white;
            animation: fadeIn 0.5s ease forwards;
        }

        .result-card img { 
            width: 100%;
            border-radius: 5px; 
        }

        @keyframes fadeIn { 
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            } to { 
                opacity: 1; 
                transform: translateY(0); 
            } 
        }

        .inv-item {
            position: relative;
        }

        .delete-btn {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            cursor: pointer;
            margin-left: auto;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #ff4d4d;
            color: white;
        }
    </style>
</head>
<body>

<div id="status-bar">
    <a href="minigame1.html" style="color: #aaa; text-decoration: none; font-size: 12px;">← Back to Game</a>
    <h2>Gacha Shop</h2>
    
    <div class="stat-box">
        <small>Mora (Coins)</small><br>
        <span id="coin-display" class="stat-val">0</span>
    </div>
    <div class="stat-box">
        <small>Primogems</small><br>
        <span id="primo-display" class="stat-val">0</span>
    </div>

    <div class="convert-section">
        <small>Convert Mora (1000 = 1 ✨)</small>
        <input type="number" id="mora-input" value="1000" step="1000" min="1000">
        <button class="wish-btn" style="width:100%; padding: 8px; font-size: 14px;" onclick="convertMora()">Exchange</button>
    </div>

    <h3>My Inventory</h3>
    <div id="inventory-list"></div>
</div>

<div id="banner-wrap">
    <img src="https://static.wikia.nocookie.net/gensin-impact/images/0/07/Item_Rye_Flour.png" style="width: 150px; filter: drop-shadow(0 0 20px gold);">
    <h1>Culinary Wanderlust</h1>
    <div class="action-buttons">
        <button class="wish-btn" onclick="wish(1)">Wish x1 (5 ✨)</button>
        <button class="wish-btn" onclick="wish(10)">Wish x10 (50 ✨)</button>
    </div>
</div>

<div id="wish-overlay"><img id="loading-gif" src="https://i.pinimg.com/originals/cf/6f/90/cf6f902d96f5976d4e29c4a5c3fa6c7e.gif"></div>
<div id="results-screen">
    <button onclick="closeResults()" style="position:fixed; top:20px; right:20px; padding:10px 20px; cursor:pointer;">CLOSE</button>
    <div id="results-grid" style="display:contents;"></div>
</div>

<script>
    const assets = {
        rarity3: "https://static.vecteezy.com/system/resources/thumbnails/045/839/708/small_2x/garbage-bag-on-transparent-background-png.png",
        rarity4: [
            { name: "Chilled Meat", img: "https://static.wikia.nocookie.net/gensin-impact/images/d/da/Item_Chilled_Meat.png" },
            { name: "Wheat", img: "https://static.wikia.nocookie.net/gensin-impact/images/0/06/Item_Wheat.png" }
        ],
        rarity5: [
            { name: "Venti Special", img: "https://static.wikia.nocookie.net/gensin-impact/images/8/8e/Item_A_Buoyant_Breeze.png" },
            { name: "Zhongli Soup", img: "https://static.wikia.nocookie.net/gensin-impact/images/6/6e/Item_Slow-Cooked_Bamboo_Shoot_Soup.png" }
        ]
    };

    let gameState = JSON.parse(localStorage.getItem('game_save')) || {
        coins: 0,
        primos: 0,
        inventory: []
    };

    if (gameState.primos === undefined) gameState.primos = 0;
    if (gameState.inventory === undefined) gameState.inventory = [];

    function save() {
        localStorage.setItem('game_save', JSON.stringify(gameState));
    }

function updateUI() {
    document.getElementById('coin-display').innerText = gameState.coins.toLocaleString();
    document.getElementById('primo-display').innerText = gameState.primos.toLocaleString();
    
    const list = document.getElementById('inventory-list');
    list.innerHTML = '';

    gameState.inventory.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `inv-item rarity-${item.rarity}`;
        
        div.innerHTML = `
            <img src="${item.img}"> 
            <div>
                <b>${item.name}</b><br>
                <small>${"★".repeat(item.rarity)}</small>
            </div>
            <button class="delete-btn" onclick="deleteItem(${index})">Delete</button>
        `;
        
        list.insertBefore(div, list.firstChild);
    });
}

function deleteItem(index) {
    if (confirm(`Are you sure you want to delete this ${gameState.inventory[index].name}?`)) {
        gameState.inventory.splice(index, 1);
        
        save();
        updateUI();
    }
}

    function convertMora() {
        const amt = parseInt(document.getElementById('mora-input').value);
        if (amt >= 1000 && gameState.coins >= amt) {
            const gain = Math.floor(amt / 1000);
            gameState.coins -= (gain * 1000);
            gameState.primos += gain;
            save(); updateUI();
        } else {
            alert("Insufficient Mora or invalid amount!");
        }
    }

    function wish(count) {
        let cost = count * 5;
        if (gameState.primos < cost) return alert("Need more Primogems!");

        gameState.primos -= cost;
        save(); updateUI();

        document.getElementById('wish-overlay').style.display = 'flex';
        setTimeout(() => {
            document.getElementById('wish-overlay').style.display = 'none';
            generateRolls(count);
        }, 4000);
    }

    function generateRolls(count) {
        const grid = document.getElementById('results-grid');
        grid.innerHTML = '';
        document.getElementById('results-screen').style.display = 'grid';

        for (let i = 0; i < count; i++) {
            let roll = Math.random() * 100;
            let item;

            if (roll < 5) {
                const pick = assets.rarity5[Math.floor(Math.random() * assets.rarity5.length)];
                item = { ...pick, rarity: 5 };
            } else if (roll < 20) {
                const pick = assets.rarity4[Math.floor(Math.random() * assets.rarity4.length)];
                item = { ...pick, rarity: 4 };
            } else {
                item = { name: "Waste", img: assets.rarity3, rarity: 3 };
            }

            gameState.inventory.push(item);
            
            const card = document.createElement('div');
            card.className = `result-card`;
            card.style.borderColor = item.rarity === 5 ? '#f3ad18' : (item.rarity === 4 ? '#a256e1' : '#5180cc');
            card.innerHTML = `<img src="${item.img}"><h4>${item.name}</h4>`;
            grid.appendChild(card);
        }
        save(); updateUI();
    }

    function closeResults() { document.getElementById('results-screen').style.display = 'none'; }

    updateUI();
</script>
</body>
</html>
