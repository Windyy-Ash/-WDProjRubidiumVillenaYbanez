<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>help</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #222; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        canvas { 
            background: #adbcbd; 
            border: 4px solid #8098a1; 
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1000;
canvas.height = 400;

const gravity = 0.8;
const moveSpeed = 7;
const jumpForce = -20;

const imgUrls = {
    idle: [
        'https://t3.ftcdn.net/jpg/01/09/92/14/360_F_109921421_Hq43saajpDYizncHS22zkZsCJNtg7fZF.jpg',
        'https://static.vecteezy.com/system/resources/thumbnails/024/861/074/small_2x/man-silhouette-in-expanding-arms-pose-vector.jpg',
        'https://cdn4.iconfinder.com/data/icons/working-human-1/48/48-1024.png'
    ],
    move: 'https://i.ytimg.com/vi/DKELand1GoQ/maxresdefault.jpg?sqp=-oaymwEmCIAKENAF8quKqQMa8AEB-AH-CYAC0AWKAgwIABABGGUgZShlMA8=&rs=AOn4CLBb4yzHfz5Bf7O0UcvBSh3o9LCUAw',
    jump: 'https://imgcdn.stablediffusionweb.com/2025/1/18/8935b7b6-63b9-4068-b310-ea77aaace79c.jpg'
};

const images = { idle: [], move: new Image(), jump: new Image() };
imgUrls.idle.forEach(url => {
    const img = new Image();
    img.src = url;
    images.idle.push(img);
});
images.move.src = imgUrls.move;
images.jump.src = imgUrls.jump;

const player = {
    x: 100,
    y: 300,
    width: 100,
    height: 100,
    velX: 0,
    velY: 0,
    onGround: false,
    facingRight: true,
    currentIdleIdx: 0,
    isMoving: false
};

const keys = {};

window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
    
    if (['a', 'd'].includes(e.key.toLowerCase())) {
        player.currentIdleIdx = Math.floor(Math.random() * images.idle.length);
    }
});

function update() {
    player.isMoving = false;

    if (keys['a'] || keys['w'] || keys['d']) {
        if (keys['a']) {
            player.velX = -moveSpeed;
            player.facingRight = false;
            player.isMoving = true;
        } else if (keys['d']) {
            player.velX = moveSpeed;
            player.facingRight = true;
            player.isMoving = true;
        } else {
            player.velX = 0;
        }

        if (keys['w'] && player.onGround) {
            player.velY = jumpForce;
            player.onGround = false;
        }
    } else {
        player.velX = 0;
    }

    player.velY += gravity;
    player.x += player.velX;
    player.y += player.velY;

    if (player.y > canvas.height - player.height) {
        player.y = canvas.height - player.height;
        player.velY = 0;
        player.onGround = true;
    }

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let activeImg;
    if (!player.onGround) {
        activeImg = images.jump;
    } else if (player.isMoving) {
        activeImg = images.move;
    } else {
        activeImg = images.idle[player.currentIdleIdx];
    }

    ctx.save();
    if (!player.facingRight) {
        ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
        ctx.scale(-1, 1);
        ctx.drawImage(activeImg, -player.width / 2, -player.height / 2, player.width, player.height);
    } else {
        ctx.drawImage(activeImg, player.x, player.y, player.width, player.height);
    }
    ctx.restore();
}

update();

</script>
</body>
</html>
